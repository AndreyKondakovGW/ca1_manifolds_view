# Settings for export_data.py -- the script that turns a manifold folder
# into the static JSON files this GitHub Pages site reads. Edit this and
# re-run `python export_data.py` any time the source data changes.

# Folder containing <session_type>/<session>.nwb, <session_type>/<session>_avg.csv
# and session_metadata.csv. An absolute path is
# used as-is; a relative path is resolved against the repo root.
manifold_folder: ""

# Optional label shown in the site's "Data source" sidebar caption instead
# of the real manifold_folder path above (which is never written to disk --
# see export_data.py). Defaults to manifold_folder's last path component
# (e.g. "sessions_processed") if left blank.
data_source_label: ""

# Where to write the exported JSON, relative to this file. The site's
# index.html/app.js expect it at ./data next to them, so leave this as "data"
# unless you also update the fetch paths in app.js.
output_dir: "data"

# Optional allowlist of sessions to export, as "<session_type>/<session>"
# strings (e.g. "same_reward_cue/srb504_250129"). Leave empty to export
# every session listed in session_metadata.csv -- useful to shrink a big
# manifold_folder down to a handful of sessions for a lightweight demo site.
sessions: []

# Decimal places to round exported floats to (UMAP coordinates, position,
# speed, time, and the per-session geodesic distance matrix -- by far the
# biggest contributor to file size, an N x N table for N averaged-manifold
# points). Keeps the JSON files small without visibly affecting the plots.
# Set to null to disable rounding.
round_decimals: 4

# The 2D session map (sessions_map.html / data/session_map.json) is built
# from session_metadata.csv's map_cord1/map_cord2 columns -- written by the
# pipeline's experiments/src/exp_session_manifold_clustering.py. No setting
# needed; run `python export_data.py --session-map-only` to refresh just the
# map after re-running that script.
